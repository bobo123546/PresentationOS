name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present build
      - run: pnpm test:node
      - run: pnpm -r --if-present test
      - run: node tests/e2e/worker-protocol.e2e.mjs
      - run: node --test tools/docs-auditor/audit-docs.test.mjs
      - run: node tools/docs-auditor/audit-docs.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test workers/powerpoint-dotnet/PresentationOS.PowerPoint.sln -c Release -warnaserror
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r 098/requirements.txt
      - name: Portable Python regression tests (no Office)
        run: python -B -m pytest 098/tests -q -p no:cacheprovider --junitxml=python-test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-python-results
          path: python-test-results.xml
          if-no-files-found: ignore
