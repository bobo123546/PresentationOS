name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24 action runtime
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=low
      - run: pnpm --workspace-concurrency=1 -r --if-present build
      - run: pnpm test:node
      - run: pnpm --workspace-concurrency=1 -r --if-present test
      - run: node tests/e2e/worker-protocol.e2e.mjs
      - name: Documentation semantics and security failure-gate regressions
        run: node --test tools/docs-auditor/audit-docs.test.mjs tools/docs-auditor/semantic-rules.test.mjs tools/packager/generate-sbom.test.mjs
      - run: node tools/docs-auditor/audit-docs.mjs
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore workers/powerpoint-dotnet/PresentationOS.PowerPoint.sln '-p:NuGetAudit=true' '-p:NuGetAuditMode=all' '-p:NuGetAuditLevel=high' -warnaserror
      - run: dotnet test workers/powerpoint-dotnet/PresentationOS.PowerPoint.sln -c Release --no-restore -warnaserror
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r 098/requirements.txt
      - name: Portable Python regression tests (no Office)
        run: python -B -m pytest 098/tests -q -p no:cacheprovider --junitxml=python-test-results.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: portable-python-results
          path: python-test-results.xml
          if-no-files-found: ignore
